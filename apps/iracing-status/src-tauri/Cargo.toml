[package]
name = "iracing-status"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "iracing_status_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "tokio",
  "ws",
] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
headers = "0.4"
http = "1"
iracing-broadcast-grpc-service = { path = "../../../crates/iracing-broadcast-grpc-service" }
iracing_status_http_api = { path = "generated/http-api" }
iracing-sdk = { path = "../../../crates/iracing-sdk", default-features = false }
iracing-simulation = { path = "../../../crates/iracing-simulation" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.24"

    additionalProperties: true
    description: Individual camera information
    properties:
      CameraName:
        default: null
        description: Camera name
        type:
        - string
        - 'null'
      CameraNum:
        default: null
        description: Camera number
        format: int32
        type:
        - integer
        - 'null'
    type: object
  CameraGroup:
    additionalProperties: true
    description: Camera group information
    properties:

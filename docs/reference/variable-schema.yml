$schema: https://json-schema.org/draft/2020-12/schema
description: Information about a specific telemetry variable.
properties:
  count:
    description: Number of elements (1 for scalar, >1 for arrays)
    format: uint
    minimum: 0
    title: Count
    type: integer
  count_as_time:
    description: Whether the simulator treats the sample count as elapsed time
    title: Count as time
    type: boolean
  data_type:
    description: Data type of the variable
    enum:
    - Character
    - Boolean
    - Integer
    - BitField
    - Float
    - Double
    title: Data type
    type: string
  description:
    description: Human-readable description
    title: Description
    type: string
  name:
    description: Variable name as defined by iRacing
    title: Name
    type: string
  offset:
    description: Byte offset within the telemetry frame
    format: uint
    minimum: 0
    title: Byte offset
    type: integer
  units:
    description: Units of measurement (e.g., "m/s", "C", "N*m")
    title: Units
    type: string
required:
- name
- data_type
- offset
- count
- count_as_time
- units
- description
title: Variable info
type: object

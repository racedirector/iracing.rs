[package]
name = "iracing-broadcast-grpc-service"
version = "0.1.0"
description = "iRacing SDK Broadcast Service for gRPC"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
iracing-sdk = { version = "0.1.0", path = '../iracing-sdk' }
prost = "0.14"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tonic-prost = "*"
tonic = "*"
tracing = { workspace = true }

[build-dependencies]
tonic-prost-build = "*"

[[bin]]
name = "iracing-broadcast-server"
path = "src/server.rs"

# [[bin]]
# name = "iracing-broadcast-client"
# path = "src/client.rs"

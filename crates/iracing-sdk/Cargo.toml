[package]
name = "iracing-sdk"
version = "0.1.0"
description = "iRacing SDK types"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
autobins = false
autoexamples = false
autobenches = false

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
async-trait = "0.1.85"
futures = { workspace = true }
iracing-irsdk = { workspace = true }
iracing-sdk-derive = { workspace = true, optional = true }
memmap2 = "0.9"
pin-project-lite = "0.2"
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tracing = { workspace = true }
zerocopy = { workspace = true }

# Windows-specific dependencies (for live telemetry)
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.0"

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
criterion = { package = "codspeed-criterion-compat", version = "5.0.2", features = ["cargo_bench_support", "html_reports"] }
iracing-sdk-derive = { workspace = true }
proptest = "1.11.0"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[features]
default = ["derive"]
benchmark = []
# Fixture helpers for downstream tests without enabling benchmark targets.
test-utils = []
codegen = ["dep:schemars", "iracing-irsdk/codegen"]
derive = ["dep:iracing-sdk-derive"]
schema-discovery = []

[[bench]]
name = "adapter-performance"
path = "benches/adapter_performance.rs"
harness = false
required-features = ["benchmark"]

[[bench]]
name = "aggregate-frame-parsing"
path = "benches/aggregate_frame_parsing.rs"
harness = false
required-features = ["benchmark"]

[[bench]]
name = "telemetry-delivery"
path = "benches/telemetry_delivery_e2e.rs"
harness = false
required-features = ["benchmark"]

[[bench]]
name = "telemetry-diagnostics"
path = "benches/telemetry_delivery_allocations.rs"
harness = false
required-features = ["benchmark"]

[[bench]]
name = "live-telemetry-diagnostic"
path = "benches/live_frame_latency.rs"
harness = false
required-features = ["benchmark"]

[[bench]]
name = "live-acquisition-diagnostic"
path = "benches/live_acquisition.rs"
harness = false
required-features = ["benchmark"]

[[bench]]
name = "ibt-reader-performance"
path = "benches/ibt_reader_performance.rs"
harness = false
required-features = ["benchmark"]

[[bench]]
name = "ibt-reader-memory"
path = "benches/ibt_reader_measurement.rs"
harness = false
required-features = ["benchmark"]

[[bench]]
name = "var-data-extraction"
path = "benches/var_data_extraction.rs"
harness = false
required-features = ["benchmark"]

[[example]]
name = "ibt-read-frame"
path = "examples/disk_position.rs"

[[example]]
name = "manual-frame-adapter"
path = "examples/adapter_disk_position.rs"

[[example]]
name = "ibt-subscribe"
path = "examples/disk_position_derive_connection.rs"
required-features = ["derive"]

[[example]]
name = "live-subscribe"
path = "examples/live_position_derive_connection.rs"
required-features = ["derive"]

[[example]]
name = "enum-bitfields-ibt"
path = "examples/enum_bitfields_disk.rs"

[[example]]
name = "session-updates"
path = "examples/session_update_observer.rs"

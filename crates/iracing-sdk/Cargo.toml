[package]
name = "iracing-sdk"
version = "0.1.0"
description = "iRacing SDK types"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.dist]
dist = true

[package.metadata.dist.bin.live-session-parser]
targets = ["x86_64-pc-windows-msvc"]

[package.metadata.dist.bin.broadcast-cli]
targets = ["x86_64-pc-windows-msvc"]

[package.metadata.dist.bin.live_to_csv]
targets = ["x86_64-pc-windows-msvc"]

[package.metadata.dist.bin.live-session-schema]
targets = ["x86_64-pc-windows-msvc"]

[package.metadata.dist.bin.live-variable-schema]
targets = ["x86_64-pc-windows-msvc"]

[package.metadata.dist.bin.live-headers]
targets = ["x86_64-pc-windows-msvc"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
encoding_rs = "0.8.35"
futures = "0.3"
iracing-sdk-derive = { version = "0.1.0", path = "../iracing-sdk-derive", optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

# Windows-specific dependencies (for live telemetry)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.0", features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = [
  "sync",
  "rt",
  "time",
] }
tokio-stream = { version = "0.1", default-features = false, features = [
  "sync",
] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", default-features = false, features = [
  "sync",
] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

[dev-dependencies]
criterion = "0.8.2"
iracing-sdk-derive = { version = "0.1.0", path = "../iracing-sdk-derive" }
proptest = "1.11.0"
test-utils = { path = "../test-utils" }

[features]
default = ["derive"]
benchmark = []
codegen = ["dep:schemars"]
derive = ["dep:iracing-sdk-derive"]
schema-discovery = []

[[bench]]
name = "var_data_extraction"
harness = false
required-features = ["benchmark"]

[[bench]]
name = "frame_construction"
harness = false
required-features = ["benchmark"]

[[example]]
name = "car-setup-observer"
path = "examples/car_setup_observer.rs"

[[example]]
name = "disk-position"
path = "examples/disk_position.rs"

[[example]]
name = "disk-position-derive"
path = "examples/disk_position_derive.rs"
required-features = ["derive"]

[[example]]
name = "live-position"
path = "examples/live_position.rs"

[[example]]
name = "live-position-derive"
path = "examples/live_position_derive.rs"
required-features = ["derive"]

[[example]]
name = "enum-bitfields-disk"
path = "examples/enum_bitfields_disk.rs"

[[example]]
name = "adapter-disk-position"
path = "examples/adapter_disk_position.rs"

[[example]]
name = "adapter-live-position"
path = "examples/adapter_live_position.rs"

[[example]]
name = "adapter-enum-bitfields-live"
path = "examples/adapter_enum_bitfields_live.rs"

[[example]]
name = "session-update-observer"
path = "examples/session_update_observer.rs"

[[bin]]
name = "broadcast-cli"
path = "src/bin/broadcast_cli.rs"

[[bin]]
name = "car-setup-schema"
path = "src/bin/car_setup_schema.rs"
required-features = ["codegen"]

[[bin]]
name = "disk-session-schema"
path = "src/bin/disk_session_schema.rs"
required-features = ["codegen"]

[[bin]]
name = "disk-variable-schema"
path = "src/bin/disk_variable_schema.rs"
required-features = ["codegen"]

[[bin]]
name = "ibt-headers"
path = "src/bin/ibt_headers.rs"

[[bin]]
name = "ibt-session-parser"
path = "src/bin/ibt_session_parser.rs"

[[bin]]
name = "live-session-schema"
path = "src/bin/live_session_schema.rs"
required-features = ["codegen"]

[[bin]]
name = "live-variable-schema"
path = "src/bin/live_variable_schema.rs"
required-features = ["codegen"]

[[bin]]
name = "primitives-schema"
path = "src/bin/primitives_schema.rs"
required-features = ["codegen"]

[[bin]]
name = "ibt-to-csv"
path = "src/bin/ibt_to_csv.rs"

[[bin]]
name = "live-headers"
path = "src/bin/live_headers.rs"

[[bin]]
name = "live-session-parser"
path = "src/bin/live_session_parser.rs"

[[bin]]
name = "live-to-csv"
path = "src/bin/live_to_csv.rs"

[[bin]]
name = "session-schema"
path = "src/bin/session_schema.rs"
required-features = ["codegen"]

[[bin]]
name = "variable-schema"
path = "src/bin/variable_schema.rs"
required-features = ["codegen"]

[package]
name = "iracing-irsdk"
version = "0.1.0"
description = "Rust representations of the native iRacing SDK wire contract"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
bitflags = { version = "2.13.2" }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }
type-layout = { workspace = true, optional = true }
zerocopy = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }

[features]
# Default include broadcast to prevent breaking things
default = ["broadcast", "serde", "debug"]
serde = ["dep:serde", "bitflags/serde"]
debug = ["serde", "dep:type-layout"]
broadcast = []

[package]
name = "iracing-sdk-cli"
version = "0.1.0"
description = "Command-line tools for the iRacing SDK"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
autobins = false
default-run = "iracing-sdk"


[package.metadata.dist]
dist = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
futures = { workspace = true }
iracing-broadcast-cli = { workspace = true }
iracing-broadcast-sdk = { workspace = true }
iracing-sdk = { workspace = true, features = ["schema-discovery", "codegen"] }
iracing-irsdk = { workspace = true, features = ["debug"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
type-layout = { workspace = true }

[[bin]]
name = "iracing-sdk"
path = "src/main.rs"

[dev-dependencies]
iracing-sdk = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }

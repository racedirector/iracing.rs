[workspace]

members = [
  "xtask",
  "crates/iracing-broadcast-cli",
  "crates/iracing-broadcast-sdk",
  "crates/iracing-irsdk",
  "crates/iracing-sdk",
  "crates/iracing-sdk-cli",
  "crates/iracing-sdk-derive",
  "crates/iracing-simulation",
  "crates/test-fixtures",
  "examples/driver-inputs",

]

resolver = "3"

[workspace.package]
authors = ["Justin Makaila <justin@treehousetechnology.io>"]
repository = "https://github.com/racedirector/iracing.rs"
homepage = "https://github.com/racedirector/iracing.rs"
license = "MIT"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
futures = "0.3"
iracing-broadcast-cli = { version = "0.1.0", path = "crates/iracing-broadcast-cli" }
iracing-broadcast-sdk = { version = "0.1.0", path = "crates/iracing-broadcast-sdk" }
iracing-irsdk = { version = "0.1.0", path = "crates/iracing-irsdk" }
iracing-sdk = { version = "0.1.0", path = "crates/iracing-sdk" }
iracing-sdk-derive = { version = "0.1.0", path = "crates/iracing-sdk-derive" }
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1" }
serde_yaml_ng = "0.10"
tempfile = "3"
thiserror = "2.0.16"
tokio = "1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
type-layout = "0.2.0"
widestring = "1.2.1"
windows = "0.62.0"
zerocopy = { version = "0.8.48", features = ["derive", "std"] }

[workspace.lints.rust]
rust_2018_idioms = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.metadata.dist]
cargo-dist-version = "0.30.4"
ci = ["github"]
installers = ["homebrew"]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
]
hosting = ["github"]
tap = "racedirector/homebrew-tap"
publish-jobs = ["homebrew"]
allow-dirty = ["ci"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

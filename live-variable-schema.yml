    description: '`enum irsdk_CarLeftRight`'
    oneOf:
    - type: string
      enum:
      - Off
      - Clear
      - CarLeft
      - CarRight
      - CarLeftRight
      - TwoCarsLeft
      - TwoCarsRight
    - type: object
      properties:
        Unknown:
          type: integer
          format: int32
      additionalProperties: false
      required:
      - Unknown
    x-irsdk-kind: enum
    x-irsdk-values:
    - name: Off
      value: 0
    - name: Clear
      value: 1
    - name: CarLeft
      value: 2
    - name: CarRight
      value: 3

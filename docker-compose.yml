services:
  iracing-broadcast-grpc-service:
    build:
      context: .
      dockerfile: crates/iracing-broadcast-grpc-service/Dockerfile
    image: iracing-broadcast-grpc-service:local
    platform: windows/amd64
    isolation: process
    environment:
      BROADCAST_ADDR: 0.0.0.0:50051
      RUST_LOG: info
    ports:
      - "50051:50051"

name: Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect docs changes
    runs-on: ubuntu-latest
    outputs:
      iracing_irsdk: ${{ steps.filter.outputs.iracing_irsdk }}
      iracing_sdk: ${{ steps.filter.outputs.iracing_sdk }}
      iracing_sdk_derive: ${{ steps.filter.outputs.iracing_sdk_derive }}
      iracing_simulation: ${{ steps.filter.outputs.iracing_simulation }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect changed crates
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            iracing_irsdk:
              - 'crates/iracing-irsdk/**'
              - '.github/workflows/docs.yml'

            iracing_sdk:
              - 'crates/iracing-irsdk/**'
              - 'crates/iracing-sdk/**'
              - 'crates/iracing-sdk-cli/**'
              - 'crates/iracing-sdk-derive/**'
              - '.github/workflows/docs.yml'

            iracing_sdk_derive:
              - 'crates/iracing-sdk-derive/**'
              - '.github/workflows/docs.yml'

            iracing_simulation:
              - 'crates/iracing-irsdk/**'
              - 'crates/iracing-simulation/**'
              - 'crates/iracing-sdk/**'
              - 'crates/iracing-sdk-derive/**'
              - '.github/workflows/docs.yml'

  iracing-irsdk-docs:
    name: iracing-irsdk docs (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.iracing_irsdk == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Run doctests
        run: cargo test -p iracing-irsdk --doc

      - name: Build docs with warnings as errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p iracing-irsdk --all-features --no-deps

      - name: Upload generated docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iracing-irsdk-docs-${{ matrix.os }}
          path: target/doc
          if-no-files-found: error

  iracing-sdk-docs:
    name: iracing-sdk docs (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.iracing_sdk == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Run doctests
        run: cargo test -p iracing-sdk --doc

      - name: Build docs with warnings as errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p iracing-sdk --no-deps
      - name: Upload generated docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iracing-sdk-docs-${{ matrix.os }}
          path: target/doc
          if-no-files-found: error

      - name: Check SDK examples
        run: cargo check -p iracing-sdk --examples

      - name: Check CLI binaries
        run: cargo check -p iracing-sdk-cli --bins --all-features

  iracing-sdk-derive-docs:
    name: iracing-sdk-derive docs (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.iracing_sdk_derive == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Run doctests
        run: cargo test -p iracing-sdk-derive --doc

      - name: Build docs with warnings as errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p iracing-sdk-derive --no-deps
      - name: Upload generated docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iracing-sdk-derive-docs-${{ matrix.os }}
          path: target/doc
          if-no-files-found: error

      - name: Check examples and binaries
        run: cargo check -p iracing-sdk-derive --examples --bins

  iracing-simulation-docs:
    name: iracing-simulation docs (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.iracing_simulation == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Run doctests
        run: cargo test -p iracing-simulation --doc

      - name: Build docs with warnings as errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p iracing-simulation --no-deps
      - name: Upload generated docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iracing-simulation-docs-${{ matrix.os }}
          path: target/doc
          if-no-files-found: error

      - name: Check examples and binaries
        run: cargo check -p iracing-simulation --examples --bins

name: Docs

on:
  pull_request:
    paths:
      - "crates/iracing-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "crates/iracing-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"

jobs:
  iracing-sdk-docs:
    name: Docs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run `iracing-sdk` doctests
        run: cargo test -p iracing-sdk --doc

      - name: Run `iracing-sdk-derive` doctests
        run: cargo test -p iracing-sdk-derive --doc

      - name: Run `iracing-simulation` doctests
        run: cargo test -p iracing-simulation --doc

      - name: Build docs with warnings as errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p iracing-sdk --no-deps

      - name: Check examples and binaries
        run: cargo check -p iracing-sdk --examples --bins

name: Docs

on:
  pull_request:
    paths:
      - "crates/iracing-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "crates/iracing-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"

jobs:
  iracing-sdk-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run doctests
        run: cargo test -p iracing-sdk --doc

      - name: Build docs with warnings as errors
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p iracing-sdk --no-deps

      - name: Check examples and binaries
        run: cargo check -p iracing-sdk --examples --bins

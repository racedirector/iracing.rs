name: Deterministic benchmarks

on:
  pull_request:
    paths:
      - ".github/workflows/benchmarks-codspeed.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/iracing-irsdk/**"
      - "crates/iracing-sdk/Cargo.toml"
      - "crates/iracing-sdk/src/adapters/**"
      - "crates/iracing-sdk/src/schema/**"
      - "crates/iracing-sdk/src/telemetry/**"
      - "crates/iracing-sdk/src/types/**"
      - "crates/iracing-sdk/src/lib.rs"
      - "crates/iracing-sdk/benches/adapter_performance.rs"
      - "crates/iracing-sdk/benches/aggregate_frame_parsing.rs"
      - "crates/iracing-sdk/benches/var_data_extraction.rs"
      - "crates/iracing-sdk/benches/support/mod.rs"
      - "crates/iracing-sdk/benches/support/workloads.rs"
      - "docs/reference/live-variable-schema.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmarks-codspeed.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/iracing-irsdk/**"
      - "crates/iracing-sdk/Cargo.toml"
      - "crates/iracing-sdk/src/adapters/**"
      - "crates/iracing-sdk/src/schema/**"
      - "crates/iracing-sdk/src/telemetry/**"
      - "crates/iracing-sdk/src/types/**"
      - "crates/iracing-sdk/src/lib.rs"
      - "crates/iracing-sdk/benches/adapter_performance.rs"
      - "crates/iracing-sdk/benches/aggregate_frame_parsing.rs"
      - "crates/iracing-sdk/benches/var_data_extraction.rs"
      - "crates/iracing-sdk/benches/support/mod.rs"
      - "crates/iracing-sdk/benches/support/workloads.rs"
      - "docs/reference/live-variable-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codspeed:
    name: Deterministic microbenchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          lfs: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.88.0"
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.2 --locked
      - name: Record benchmark build identity
        shell: bash
        run: |
          {
            echo '## Tier-B benchmark build identity'
            echo '```text'
            rustc -Vv
            cargo -V
            # cargo-codspeed 5.0.2 returns 1 for clap's version display.
            codspeed_version=$(cargo codspeed --version 2>&1) || test "$?" -eq 1
            test "$codspeed_version" = 'cargo-codspeed 5.0.2'
            echo "$codspeed_version"
            echo "commit=$(git rev-parse HEAD)"
            sha256sum Cargo.lock
            echo 'target=x86_64-unknown-linux-gnu'
            echo 'profile=bench; features=default,benchmark; mode=simulation'
            echo 'codspeed-action=373d6868929f444bc08d901fd0eb0ad52a8875ea'
            echo 'codspeed-runner=5.2.1'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build CodSpeed benchmarks
        run: >
          cargo codspeed build
          --locked
          --profile bench
          -p iracing-sdk
          --features benchmark
          --bench var-data-extraction
          --bench adapter-performance
          --bench aggregate-frame-parsing
      - name: Run CodSpeed benchmarks
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5
        with:
          mode: simulation
          runner-version: "5.2.1"
          run: cargo codspeed run

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publishing: ${{ steps.plan.outputs.publishing }}
      val: ${{ steps.plan.outputs.val }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.4/cargo-dist-installer.sh | sh

      - name: Compute release plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi

          if [[ -z "${TAG}" ]]; then
            echo "Release tag is required."
            exit 1
          fi

          dist plan --allow-dirty --tag "${TAG}" --output-format=json > dist-manifest.json

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "publishing=$(cat dist-manifest.json | jq -r '.publishing // "false"')" >> "$GITHUB_OUTPUT"

          {
            echo "val<<EOF"
            cat dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload dist manifest
        uses: actions/upload-artifact@v7
        with:
          name: dist-manifest
          path: dist-manifest.json

  build-local-artifacts:
    name: Build Local Artifacts
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dist (bash)
        if: ${{ matrix.install_dist.shell == 'bash' }}
        shell: bash
        run: ${{ matrix.install_dist.run }}

      - name: Install dist (pwsh)
        if: ${{ matrix.install_dist.shell == 'pwsh' }}
        shell: pwsh
        run: ${{ matrix.install_dist.run }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ join(matrix.targets, ',') }}

      - name: Build local artifacts (bash)
        if: ${{ matrix.install_dist.shell == 'bash' }}
        shell: bash
        run: dist build --allow-dirty ${{ matrix.dist_args }} --tag "${{ needs.plan.outputs.tag }}"

      - name: Build local artifacts (pwsh)
        if: ${{ matrix.install_dist.shell == 'pwsh' }}
        shell: pwsh
        run: dist build --allow-dirty ${{ matrix.dist_args }} --tag "${{ needs.plan.outputs.tag }}"

      - name: Upload local artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.host }}
          path: target/distrib/*

  build-global-artifacts:
    name: Build Global Artifacts
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.4/cargo-dist-installer.sh | sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build global artifacts
        shell: bash
        run: dist build --allow-dirty --artifacts=global --tag "${{ needs.plan.outputs.tag }}"

      - name: Upload global artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-global
          path: target/distrib/*

  host:
    name: Host Artifacts
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.4/cargo-dist-installer.sh | sh

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - name: Host release artifacts
        shell: bash
        run: dist host --allow-dirty --steps=create --steps=upload --steps=release --steps=announce --tag "${{ needs.plan.outputs.tag }}"


name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Workspace Quality Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Rust toolchain diagnostics
        run: |
          rustc --version
          cargo --version

      - name: Verify generated fixtures
        run: python scripts/check_test_fixtures.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --keep-going -- -D
          warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets

  wasm-compat:
    name: Wasm Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check `iracing-sdk` for wasm
        run: cargo check -p iracing-sdk --lib --target wasm32-unknown-unknown
          --all-features

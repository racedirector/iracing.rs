name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Workspace Quality Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Rust toolchain diagnostics
        run: |
          rustc --version
          cargo --version

      - name: Check repository consistency
        run: cargo xtask check-repo

      - name: Verify generated fixtures
        run: cargo test-fixtures

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace (windows)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --all-features --keep-going -- -D warnings

      - name: Lint workspace (not windows)
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --exclude iracing-broadcast-sdk --all-targets --all-features --keep-going -- -D warnings

      - name: Test workspace (windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --all-targets

      - name: Test workspace (not windows)
        if: runner.os != 'Windows'
        run: cargo test --workspace --exclude iracing-broadcast-sdk --all-targets

      - name: Compile all benchmarks
        run: cargo bench -p iracing-sdk --features benchmark --no-run

name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Workspace Quality Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Rust toolchain diagnostics
        run: |
          rustc --version
          cargo --version

      - name: Check repository consistency
        run: cargo xtask check-repo

      - name: Verify generated fixtures
        run: cargo test-fixtures

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --keep-going -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Test benchmark delivery and recorded harnesses
        run: "cargo test -p iracing-sdk --features benchmark --lib benchmarking::"

      - name: Compile all benchmarks
        run: cargo bench -p iracing-sdk --features benchmark --no-run

name: Support contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  msrv:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - run: cargo check --locked --workspace --all-features
  features:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        flags: ['', '--no-default-features', '--all-features', '--no-default-features --features codegen,schema-discovery']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Test public library configuration
        run: cargo test --locked -p iracing-sdk --lib ${{ matrix.flags }}
      - run: cargo test --locked -p iracing-irsdk --all-features
  release-targets:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --locked --workspace --all-features --target ${{ matrix.target }}

name: Benchmarks

on:
  pull_request:
    paths:
      - ".github/workflows/benchmarks.yml"
      - ".cargo/config.toml"
      - ".gitattributes"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/iracing-irsdk/**"
      - "crates/iracing-sdk/**"
      - "crates/test-fixtures/**"
      - "test-data/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/benchmarks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/iracing-sdk/**"
      - "test-data/**"
  schedule:
    - cron: "17 5 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark sampling mode
        required: true
        default: full
        type: choice
        options:
          - full
          - quick

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  criterion:
    name: ${{ matrix.benchmark }} (${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')) && 'full' || 'quick' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          - adapter-performance
          - aggregate-frame-parsing
          - telemetry-delivery
          - telemetry-diagnostics
          - ibt-reader-performance
          - ibt-reader-memory
          - var-data-extraction
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run quick benchmark smoke
        if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'quick')
        run: cargo bench -p iracing-sdk --features benchmark --bench ${{ matrix.benchmark }} -- --quick

      - name: Run statistically sampled benchmark
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: cargo bench -p iracing-sdk --features benchmark --bench ${{ matrix.benchmark }}

      - name: Upload Criterion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ matrix.benchmark }}-${{ github.run_id }}
          path: target/criterion
          if-no-files-found: ignore
          retention-days: 14

  ibt-reader-comparison:
    name: ibt_reader_performance (PR base vs head)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Both checkouts use this target directory so Criterion's named baseline
      # survives the revision switch. Cargo rebuilds changed sources as needed.
      CARGO_TARGET_DIR: ${{ github.workspace }}/ibt-reader-target
    steps:
      - name: Checkout PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: pr-base
          lfs: true

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check benchmark inputs and LFS fixtures
        shell: bash
        run: |
          for checkout in pr-base pr-head; do
            for fixture in \
              'test-data/fordmustanggt4_donington national 2026-04-09 21-57-46.ibt' \
              'test-data/ibt/b_mustang_bristol_race.ibt'; do
              if [[ ! -f "$checkout/$fixture" || $(wc -c < "$checkout/$fixture") -lt 1000000 ]]; then
                echo "Missing or unhydrated IBT fixture: $checkout/$fixture" >&2
                exit 1
              fi
            done
          done

          # Flag changes to the experiment or its inputs. Reader implementation
          # changes are expected; these paths affect comparability of the runs.
          for input in \
            crates/iracing-sdk/benches/ibt_reader_performance.rs \
            crates/iracing-sdk/benches/support \
            crates/test-fixtures/src \
            'test-data/fordmustanggt4_donington national 2026-04-09 21-57-46.ibt' \
            test-data/ibt/b_mustang_bristol_race.ibt \
            test-data/ibt/manifest.json \
            .gitattributes \
            .cargo/config.toml \
            Cargo.toml \
            Cargo.lock \
            crates/iracing-sdk/Cargo.toml; do
            if [[ -d "pr-base/$input" || -d "pr-head/$input" ]]; then
              if ! diff -qr "pr-base/$input" "pr-head/$input" >/dev/null; then
                echo "$input" >> "$RUNNER_TEMP/ibt-changed-inputs.txt"
              fi
            elif ! cmp -s "pr-base/$input" "pr-head/$input"; then
              echo "$input" >> "$RUNNER_TEMP/ibt-changed-inputs.txt"
            fi
          done

      - name: Measure PR base
        working-directory: pr-base
        shell: bash
        run: |
          rm -rf "$CARGO_TARGET_DIR/criterion"
          cargo bench --locked --quiet -p iracing-sdk --features benchmark --bench ibt-reader-performance -- --save-baseline pr-base --color never 2>&1 | tee "$RUNNER_TEMP/ibt-base.log"

      - name: Compare PR head with base
        id: compare
        working-directory: pr-head
        shell: bash
        run: |
          cargo bench --locked --quiet -p iracing-sdk --features benchmark --bench ibt-reader-performance -- --baseline-lenient pr-base --color never 2>&1 | tee "$RUNNER_TEMP/ibt-head.log"

      - name: Summarize comparison
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMPARISON_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          {
            echo '## IBT reader benchmark: PR base vs head'
            echo
            echo "Base: \`$BASE_SHA\` · Head: \`$HEAD_SHA\`"
            echo
            echo 'Statistically sampled on the same runner. Results are informational; a measured slowdown does not fail this PR.'
            echo
            if [[ "$COMPARISON_OUTCOME" != success ]]; then
              echo '> **Comparison incomplete:** The benchmark did not finish. Check the failed step before interpreting any partial output below.'
              echo
            fi
            if [[ -s "$RUNNER_TEMP/ibt-changed-inputs.txt" ]]; then
              echo '> **Comparability warning:** Benchmark definitions, fixtures, generation code, or build inputs differ between revisions. The reported deltas may not measure the same experiment.'
              echo
              echo 'Changed inputs:'
              sed 's/^/- `/' "$RUNNER_TEMP/ibt-changed-inputs.txt" | sed 's/$/`/'
              echo
            fi
            if [[ -s "$RUNNER_TEMP/ibt-head.log" ]]; then
              echo '### Criterion results (head vs base where available)'
              echo
              echo 'Existing benchmark IDs are compared against the PR base. New benchmark IDs are measured without a baseline and become comparable after they land on the base branch.'
              echo
              echo '```text'
              cat "$RUNNER_TEMP/ibt-head.log"
              echo '```'
              echo
            else
              echo 'The head comparison did not complete. Check the job log and artifact.'
              echo
            fi
            if [[ -s "$RUNNER_TEMP/ibt-base.log" ]]; then
              echo '<details><summary>Base measurements</summary>'
              echo
              echo '```text'
              cat "$RUNNER_TEMP/ibt-base.log"
              echo '```'
              echo '</details>'
              echo
            fi
            echo "Full Criterion report: workflow artifact \`criterion-ibt-reader-comparison-${{ github.run_id }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Criterion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-ibt-reader-comparison-${{ github.run_id }}
          path: ${{ github.workspace }}/ibt-reader-target/criterion
          if-no-files-found: ignore
          retention-days: 14

  diagnostics:
    name: ${{ matrix.benchmark }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          - telemetry_delivery_allocations
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run diagnostic
        run: cargo bench -p iracing-sdk --features benchmark --bench ${{ matrix.benchmark }}

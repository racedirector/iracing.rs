name: Benchmark diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/benchmarks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/iracing-sdk/Cargo.toml"
      - "crates/iracing-irsdk/**"
      - "crates/iracing-sdk/src/**"
      - "crates/iracing-sdk/benches/support/**"
      - "crates/iracing-sdk/benches/telemetry_delivery_allocations.rs"
      - "crates/iracing-sdk/benches/ibt_reader_measurement.rs"
      - "test-data/**"
      - "docs/reference/live-variable-schema.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmarks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/iracing-sdk/Cargo.toml"
      - "crates/iracing-irsdk/**"
      - "crates/iracing-sdk/src/**"
      - "crates/iracing-sdk/benches/support/**"
      - "crates/iracing-sdk/benches/telemetry_delivery_allocations.rs"
      - "crates/iracing-sdk/benches/ibt_reader_measurement.rs"
      - "test-data/**"
      - "docs/reference/live-variable-schema.yml"
  workflow_dispatch:

jobs:
  diagnostics:
    name: ${{ matrix.benchmark }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          - telemetry-diagnostics
          - ibt-reader-memory
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run diagnostic
        run: cargo bench -p iracing-sdk --features benchmark --bench ${{ matrix.benchmark }}

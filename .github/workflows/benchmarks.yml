name: Benchmark diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/benchmarks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/iracing-sdk/Cargo.toml"
      - "crates/iracing-irsdk/**"
      - "crates/iracing-sdk/src/**"
      - "crates/iracing-sdk/benches/support/**"
      - "crates/iracing-sdk/benches/telemetry_delivery_allocations.rs"
      - "crates/iracing-sdk/benches/ibt_reader_measurement.rs"
      - "test-data/**"
      - "docs/reference/live-variable-schema.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmarks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/iracing-sdk/Cargo.toml"
      - "crates/iracing-irsdk/**"
      - "crates/iracing-sdk/src/**"
      - "crates/iracing-sdk/benches/support/**"
      - "crates/iracing-sdk/benches/telemetry_delivery_allocations.rs"
      - "crates/iracing-sdk/benches/ibt_reader_measurement.rs"
      - "test-data/**"
      - "docs/reference/live-variable-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: ${{ matrix.benchmark }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          - telemetry-diagnostics
          - ibt-reader-memory
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          lfs: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run diagnostic
        run: cargo bench -p iracing-sdk --features benchmark --bench ${{ matrix.benchmark }}
